name: Deploy assistant

# Push to main that touches the Worker -> tests -> Cloudflare Workers -> smoke test.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://malmarquez.com
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # CORS preflight only: proves the Worker is up without spending AI quota
      - name: Smoke test (Worker responds)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H "Origin: https://malmarquez.com" \
              "https://marc-assistant.m-marquez27.workers.dev/chat")
            if [ "$code" = "204" ]; then echo "Worker is up (HTTP $code)"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s"; sleep 10
          done
          echo "::error::Worker smoke test failed"; exit 1
