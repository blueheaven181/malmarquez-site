name: Deploy site

# Push to main that touches the site -> checks -> Cloudflare Pages -> smoke test.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Pages
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://malmarquez.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy site
          --project-name=marc-marquez-portfolio
          --branch=main
          --commit-hash=${{ github.sha }}

      - name: Smoke test (site is up and serves this version)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w '%{http_code}' "https://malmarquez.com/?v=${GITHUB_SHA}")
            if [ "$code" = "200" ] && grep -q 'marc-assistant.js' page.html; then
              echo "malmarquez.com is up (HTTP $code) and the chat widget is wired in"; exit 0
            fi
            echo "attempt $i: HTTP $code, retrying in 10s"; sleep 10
          done
          echo "::error::malmarquez.com smoke test failed"; exit 1
