name: CI

# Runs on every push and pull request. Deploy workflows reuse this as their gate.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          for f in site/*.js; do echo "checking $f"; node --check "$f"; done
      - name: Local links, required files, chat widget wiring
        run: python3 scripts/check_site.py

  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (AI model mocked)
        run: npm test
      - name: Bundle check (dry run, nothing is deployed)
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
